<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hide Google AI Mode</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #15141a;
      --bg: #ffffff;
      --muted: #5b5b66;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #fbfbfe;
        --bg: #2b2a33;
        --muted: #b8b8c2;
      }
    }
    body {
      width: 240px;
      margin: 0;
      padding: 12px 14px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      cursor: pointer;
    }
    input {
      margin: 0;
      flex: none;
    }
    p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>Hide Google AI Mode</h1>

  <label>
    <input type="checkbox" id="hideAiTab">
    Hide the "AI Mode" tab
  </label>

  <label>
    <input type="checkbox" id="hideAiOverview">
    Hide "AI Overview" results
  </label>

  <p>Changes apply immediately, no reload needed.</p>

  <script src="popup.js"></script>
</body>
</html>
